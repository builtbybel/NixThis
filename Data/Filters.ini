; The two lists below decide how NixThis talks about an installed app. They are not rows of
; their own: every app in the Start menu is listed anyway, these only say what NixThis thinks
; of it. One Package line per entry, matched against the start of the package family name.
; A line beginning with * matches the end instead, which is how a publisher is caught.
; An app on neither list is a personal decision and is offered without a recommendation,
; because what is clutter to one person is the reason someone else opens the PC.
[Apps Windows needs]
Action=apps
Safety=Protected
Package=*_cw5n1h2txyewy
Package=Microsoft.WindowsStore
Package=Microsoft.DesktopAppInstaller
Package=Microsoft.SecHealthUI
Package=Microsoft.UI.Xaml
Package=Microsoft.VCLibs
Package=Microsoft.NET.Native
Package=Microsoft.WindowsAppRuntime
Package=Microsoft.MicrosoftEdge

