; Filters.ini - everything NixThis knows, in one file
;
; Swap this file and NixThis knows different things. No new build, no installer. The version
; below is shown next to the filter count, so two lists can be told apart.
Version=1.1
;
; Every section is one filter. Which keys it carries says what kind it is.
; Keys:
;   Match             = AutomationId or ClassName of the element you clicked, or of one of its
;                       parents - never the visible text, that one is translated on every Windows
;   Names             = the visible label, semicolon separated, for the few things that carry no
;                       usable id at all. The ini holds the English wording, Rule_Names_<section>
;                       in each locale file holds the translated one. Always pair it with Process.
;   Process           = the program the element must belong to (empty = any)
;   App               = the programs this filter is about, semicolon separated, written the way
;                       they should be read. Unlike Process it never decides a match - it is the
;                       fallback when the element itself is a miss: pointing at anything called
;                       "Microsoft Edge", or at anything inside msedge, then offers every
;                       App=Edge filter. More than one is allowed, because the taskbar search
;                       box belongs to Search and to the taskbar alike.
;   Where             = which corner of Windows this sits in, shown in the list's Where column
;                       and offered in the funnel: Taskbar, StartMenu, Explorer, Desktop, Search,
;                       LockScreen or Edge. Three more name a subject instead of a place, for the
;                       switches you cannot point at: Ads, Privacy and Apps. A place always wins,
;                       so the advert on the lock screen stays under LockScreen. Otherwise the
;                       column would answer two different questions at once.
;                       Omitted means Windows itself, which is where a setting with neither a
;                       place nor a subject belongs. Each value needs a Where_<value> line in the
;                       locale files.
;   Action            = scan      pointing at it opens the list
;                       group     the section is not a filter, it only says which App a window
;                                 belongs to when the element itself is a miss
;                       uninstall the section name is the app as the Start menu shows it
;                       apps      the section is a package list, see the bottom of this file
;                       omitted   write a registry value
;   Question          = what the card asks you
;   Detail            = one sentence on what changes
;   Path / ValueName / ValueType / RecommendedValue / DefaultValue
;                     = the registry entry behind it, DefaultValue is what Undo writes back
;   Restart           = explorer  the shell is restarted, which is the only way most taskbar
;                                 and Explorer settings show up. On more than one monitor it
;                                 also throws the desktop icons back onto the first screen.
;                       desktop   only the desktop icons are drawn again, no restart
;                       omitted   nothing has to happen
;   Package           = one package family name per line, only in an Action=apps section
;   Safety            = Protected or Safe, only in an Action=apps section

; A section without Match has nothing on screen to point at. It never shows up under the
; crosshair and only ever appears in the list behind Ctrl+Shift+A - unless it carries App,
; which is how a whole group of them becomes reachable from one icon.

; Rules under HKEY_LOCAL_MACHINE or \Policies\ change the whole PC and are refused for a
; normal user. NixThis says so and offers to start itself again as administrator.
; DefaultValue=<deletevalue> means Undo removes the value instead of writing one back,
; because Windows has no default of its own for that setting.

; The six sections below are not filters and never appear in the list. They answer a
; different question: which app or which window did the user point at. That is why none
; of them carries a Question.

[Start button]
Match=startbutton
Process=explorer
App=Start
Action=scan
Detail=Everything {app} knows about, in one list.

; Copilot is a pinned app, not a shell button: the taskbar draws it as an ordinary pinned
; icon, so only its label names it, ShowCopilotButton does nothing on current Windows, and
; the pin itself lives in an undocumented blob. Uninstalling is the one honest way off it.
; Which package that is differs per machine, so Start is asked instead of naming one here.
[Copilot]
Names=Copilot
Process=explorer
Action=uninstall
Question=Remove Copilot?
Detail=The app is uninstalled and its taskbar icon goes with it. The Store has it back any time.

; explorer draws the taskbar, the file windows and the desktop, so the program name cannot
; tell them apart - the window class can, and that is all these two sections do
[Taskbar]
Action=group
Match=shell_traywnd
App=Taskbar

[File Explorer]
Action=group
Match=cabinetwclass
App=Explorer

; WorkerW is the desktop while a slideshow background is running, Progman the rest of the time
[Desktop]
Action=group
Match=progman;workerw
App=Desktop

; the hover panel is its own window, so pointing at the weather leads back to the button
[Weather panel]
Action=group
Match=msn.shell;msn.weather
App=Widgets

; --- Taskbar ---

[Task view button]
Where=Taskbar
Match=taskviewbutton
Process=explorer
App=Taskbar
Question=Remove the Task View button from the taskbar?
Detail=The button disappears. Win+Tab keeps working.
Path=HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
ValueName=ShowTaskViewButton
ValueType=DWORD
RecommendedValue=0
DefaultValue=1

[Taskbar search]
Where=Taskbar
Match=searchbox;search
Process=explorer
App=Search;Taskbar
Question=Remove the search box from the taskbar?
Detail=The box disappears. Search still opens with the Start menu or Win+S.
Path=HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Search
ValueName=SearchboxTaskbarMode
ValueType=DWORD
RecommendedValue=0
DefaultValue=1

; the per user switch TaskbarDa only hides the button. This is the policy that turns the feature
; itself off, which is why it sits in the machine wide hive and needs an administrator
[Widgets]
Where=Taskbar
Match=widget
Process=explorer
App=Widgets;Taskbar
Question=Remove Widgets from the taskbar?
Detail=The button, its panel and the weather strip go, and the feature itself is off, not hidden.
Path=HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Dsh
ValueName=AllowNewsAndInterests
ValueType=DWORD
RecommendedValue=0
DefaultValue=<deletevalue>
Restart=explorer

[Chat button]
Where=Taskbar
Match=chaticon;chat
Process=explorer
App=Taskbar
Question=Remove the Chat button from the taskbar?
Detail=The button disappears. Teams stays installed.
Path=HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
ValueName=TaskbarMn
ValueType=DWORD
RecommendedValue=0
DefaultValue=1
Restart=explorer

; the clock opens the notification centre, and all four tray icons share the id SystemTrayIcon,
; so only the class name tells the clock apart from volume and network. Windows has called that
; button OmniButtonLeft and SystemTray.OmniButton in different builds, so only the part both
; spellings share is matched. Windows 10 never built its taskbar in XAML and still calls the
; clock by its old Win32 class, hence the second word
[Suggested notifications]
Where=Taskbar
Match=omnibutton;trayclockwclass
Process=explorer
App=Taskbar
Question=Stop Windows suggesting things through notifications?
Detail=The toasts that advertise features stop. Your apps keep notifying you.
Path=HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Notifications\Settings\Windows.SystemToast.Suggested
ValueName=Enabled
ValueType=DWORD
RecommendedValue=0
DefaultValue=1

[Meet Now button]
