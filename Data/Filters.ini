App=Taskbar
Question=Remove the Meet Now button from the tray?
Detail=The Skype call icon next to the clock goes. Skype stays installed.
Path=HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer
ValueName=HideSCAMeetNow
ValueType=DWORD
RecommendedValue=1
DefaultValue=0
Restart=explorer

